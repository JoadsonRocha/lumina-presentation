<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Projeção</title>
    <style>
        :root {
            --safe-padding: 0px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #000000;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            cursor: none;
            position: relative;
        }
        body.show-cursor {
            cursor: default;
        }

        /* Ambilight Background Glow */
        .ambilight-bg {
            position: absolute;
            inset: -30px;
            z-index: 1;
            filter: blur(50px) brightness(0.5);
            opacity: 0;
            transition: opacity 0.6s ease;
            transform: scale(1.1);
            pointer-events: none;
            background-size: cover;
            background-position: center;
        }
        .ambilight-bg.active {
            opacity: 0.45;
        }

        /* Projection Stage Container */
        .stage-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--safe-padding);
            transition: padding 0.25s ease;
        }

        .media-element {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
            opacity: 0;
        }
        .media-element.visible {
            opacity: 1;
        }
        .media-element.fit-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Ken Burns Animation for Projector */
        @keyframes kenBurnsEffect {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.06) translate(-1%, 0.8%); }
            100% { transform: scale(1) translate(0, 0); }
        }
        .ken-burns {
            animation: kenBurnsEffect 16s ease-in-out infinite alternate !important;
        }

        /* Slide Transition classes */
        .slide-out {
            transform: translateX(-35px);
            opacity: 0 !important;
        }
        .slide-in {
            transform: translateX(35px);
            opacity: 0 !important;
        }
        .zoom-fade-out {
            transform: scale(1.05);
            opacity: 0 !important;
        }

        /* Stage Overlays (Blackout & Whiteout) */
        .stage-overlay {
            position: fixed;
            inset: 0;
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .stage-overlay.blackout {
            background-color: #000000;
        }
        .stage-overlay.whiteout {
            background-color: #ffffff;
        }
        .stage-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Navigation & Hints */
        .nav-overlay {
            position: absolute;
            inset: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        body.show-cursor .nav-overlay {
            opacity: 1;
        }
        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(14, 14, 18, 0.7);
            backdrop-filter: blur(12px);
            color: #ffffff;
            font-size: 2.2rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            pointer-events: auto;
        }
        .nav-btn:hover {
            background: rgba(30, 30, 38, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .close-hint {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 100;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
            font-weight: 500;
            background: rgba(14, 14, 18, 0.75);
            backdrop-filter: blur(12px);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        body.show-cursor .close-hint {
            opacity: 1;
        }

        .media-badge {
            position: absolute;
            bottom: 20px;
            left: 24px;
            z-index: 100;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.78rem;
            font-weight: 500;
            background: rgba(14, 14, 18, 0.75);
            backdrop-filter: blur(12px);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        body.show-cursor .media-badge {
            opacity: 1;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body class="show-cursor">
    <!-- Ambilight Background Glow -->
    <div id="ambilightBg" class="ambilight-bg"></div>

    <!-- Blackout / Whiteout Overlays -->
    <div id="blackoutOverlay" class="stage-overlay blackout"></div>
    <div id="whiteoutOverlay" class="stage-overlay whiteout"></div>

    <!-- Header info & Close hint -->
    <div class="close-hint">ESC ou F5 para fechar projeção</div>
    <div id="mediaBadge" class="media-badge">Lumina</div>

    <!-- Stage Container -->
    <div id="stageContainer" class="stage-container">
        <img id="projectorImage" class="media-element" src="" alt="Lumina Image">
        <video id="projectorVideo" class="media-element hidden" src="" autoplay playsinline></video>
    </div>
    
    <div class="nav-overlay">
        <button id="prevBtn" class="nav-btn" title="Anterior">‹</button>
        <button id="nextBtn" class="nav-btn" title="Próximo">›</button>
    </div>

    <script>
        const ambilightBg = document.getElementById('ambilightBg');
        const stageContainer = document.getElementById('stageContainer');
        const projectorImage = document.getElementById('projectorImage');
        const projectorVideo = document.getElementById('projectorVideo');
        const blackoutOverlay = document.getElementById('blackoutOverlay');
        const whiteoutOverlay = document.getElementById('whiteoutOverlay');
        const mediaBadge = document.getElementById('mediaBadge');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        let idleTimer = null;
        let currentState = null;

        function toFileUrl(filePath) {
            if (!filePath) return '';
            if (filePath.startsWith('file://') || filePath.startsWith('data:') || filePath.startsWith('blob:')) {
                return filePath;
            }
            let normalized = filePath.replace(/\\/g, '/');
            if (!normalized.startsWith('/')) {
                normalized = '/' + normalized;
            }
            return 'file://' + encodeURI(normalized);
        }

        function resetIdleTimer() {
            document.body.classList.add('show-cursor');
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                document.body.classList.remove('show-cursor');
            }, 3000);
        }

        document.addEventListener('mousemove', resetIdleTimer);

        function applyMedia(state) {
            if (!state || !state.media) return;
            currentState = state;
            
            const media = state.media;
            const fit = state.fit || 'contain';
            const filter = state.filter || 'none';
            const rotation = state.rotation || 0;
            const borderSize = state.borderSize !== undefined ? state.borderSize : 0;
            const transitionType = state.transitionType || 'fade';
            const enableAmbilight = state.ambilightEnabled !== false;

            // Safe padding
            stageContainer.style.setProperty('--safe-padding', `${borderSize}px`);

            // Apply Blackout & Whiteout state
            blackoutOverlay.classList.toggle('active', !!state.blackout);
            whiteoutOverlay.classList.toggle('active', !!state.whiteout);

            // Badge text
            mediaBadge.textContent = media.name || (media.type === 'video' ? 'Vídeo' : 'Imagem');

            if (media.type === 'video') {
                // Video Mode
                projectorImage.classList.add('hidden');
                projectorImage.classList.remove('visible');
                
                projectorVideo.classList.remove('hidden');
                projectorVideo.style.filter = filter;
                projectorVideo.className = `media-element ${fit === 'cover' ? 'fit-cover' : ''}`;
                projectorVideo.style.transform = `rotate(${rotation}deg)`;

                const videoSrc = toFileUrl(media.path);
                if (projectorVideo.src !== videoSrc) {
                    projectorVideo.src = videoSrc;
                }
                projectorVideo.muted = !!state.videoMuted;
                if (state.videoVolume !== undefined) projectorVideo.volume = state.videoVolume;
                projectorVideo.loop = (state.videoAutoAdvance === false && !!state.loopEnabled) || !!state.loopVideo;
                projectorVideo.play().catch(() => {});

                // Reveal
                setTimeout(() => {
                    projectorVideo.classList.add('visible');
                }, 40);

                // Ambilight
                ambilightBg.style.backgroundImage = 'none';
                ambilightBg.classList.remove('active');
            } else {
                // Image Mode
                if (!projectorVideo.paused) projectorVideo.pause();
                projectorVideo.classList.add('hidden');
                projectorVideo.classList.remove('visible');
                
                projectorImage.classList.remove('hidden');
                projectorImage.style.filter = filter;
                projectorImage.className = `media-element ${fit === 'cover' ? 'fit-cover' : ''} ${transitionType === 'ken-burns' ? 'ken-burns' : ''}`;
                projectorImage.style.transform = `rotate(${rotation}deg)`;

                const imgSrc = toFileUrl(media.path);

                // Smooth Transition Out
                if (transitionType === 'slide') {
                    projectorImage.classList.add('slide-out');
                } else if (transitionType === 'zoom-fade') {
                    projectorImage.classList.add('zoom-fade-out');
                } else if (transitionType === 'none') {
                    projectorImage.style.opacity = 1;
                } else {
                    projectorImage.classList.remove('visible');
                }

                setTimeout(() => {
                    projectorImage.src = imgSrc;
                    projectorImage.classList.remove('slide-out', 'zoom-fade-out');
                    projectorImage.classList.add('visible');

                    // Ambilight
                    if (enableAmbilight) {
                        ambilightBg.style.backgroundImage = `url("${imgSrc.replace(/"/g, '\\"')}")`;
                        ambilightBg.classList.add('active');
                    } else {
                        ambilightBg.classList.remove('active');
                    }
                }, transitionType === 'none' ? 0 : 90);
            }
        }

        // IPC Listeners
        window.electronAPI.onSyncProjection((state) => {
            applyMedia(state);
        });

        window.electronAPI.onStageCommand((cmd) => {
            if (cmd === 'toggle-blackout') {
                blackoutOverlay.classList.toggle('active');
                whiteoutOverlay.classList.remove('active');
            } else if (cmd === 'toggle-whiteout') {
                whiteoutOverlay.classList.toggle('active');
                blackoutOverlay.classList.remove('active');
            } else if (cmd === 'clear-stage') {
                blackoutOverlay.classList.remove('active');
                whiteoutOverlay.classList.remove('active');
            }
        });

        // Navigation
        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.electronAPI.navigatePrev();
            resetIdleTimer();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            window.electronAPI.navigateNext();
            resetIdleTimer();
        });

        document.addEventListener('keydown', (e) => {
            resetIdleTimer();
            if (e.key === 'Escape' || e.key === 'F5') {
                e.preventDefault();
                window.electronAPI.closePresentation();
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                window.electronAPI.navigateNext();
            } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                window.electronAPI.navigatePrev();
            } else if (e.key === 'b' || e.key === 'B') {
                blackoutOverlay.classList.toggle('active');
                whiteoutOverlay.classList.remove('active');
            } else if (e.key === 'w' || e.key === 'W') {
                whiteoutOverlay.classList.toggle('active');
                blackoutOverlay.classList.remove('active');
            }
        });

        resetIdleTimer();
    </script>
</body>
</html>
